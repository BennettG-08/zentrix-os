<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZENTRIX OS</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    background:#000;
    font-family:Consolas, monospace;
    color:#00ff66;
}

canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:-1;
}

.container{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.box{
    width:90%;
    max-width:850px;
    padding:35px;
    background:rgba(0,0,0,.75);
    border:2px solid #00ff66;
    box-shadow:0 0 30px #00ff66;
    border-radius:15px;
    text-align:center;
}

h1{
    font-size:45px;
    text-shadow:0 0 20px #00ff66;
}

button{
    margin-top:30px;
    padding:18px 40px;
    font-size:20px;
    font-weight:bold;
    color:#00ff66;
    background:black;
    border:2px solid #00ff66;
    border-radius:10px;
    cursor:pointer;
    box-shadow:0 0 20px #00ff66;
}

button:hover{
    background:#00ff66;
    color:black;
}

#terminal{
    display:none;
    text-align:left;
    margin-top:25px;
    line-height:1.8;
}

.title{
    text-align:center;
    font-size:28px;
    margin-bottom:20px;
}

.blink{
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

.line{
    overflow:hidden;
    white-space:nowrap;
    animation:write 2s steps(40);
}

@keyframes write{
    from{
        width:0;
    }
    to{
        width:100%;
    }
}

</style>

</head>

<body>

<canvas id="matrix"></canvas>


<div class="container">

<div class="box">

<h1>ZENTRIX OS</h1>

<button onclick="startSystem()">
INICIAR ZENTRIX OS
</button>


<div id="terminal">

<div class="title">
ZENTRIX OS v9.0
</div>


<p class="line">
> Sistema iniciado...
</p>

<p class="line">
> Modo leyenda activado...
</p>

<p class="line">
> Comunidad cargada...
</p>

<br>

<h2>
LEGENDARIOS DE AMÉRICA
</h2>

<br>

<p>
⭐ Leyendas originales ⭐
</p>

<p>
Siempre humillados por Zentrix
</p>

<br>

<p>
> Estado: ONLINE ✔
</p>

<p class="blink">
▋ Esperando comando...
</p>

</div>

</div>

</div>


<script>

function startSystem(){

document.querySelector("button").style.display="none";

document.getElementById("terminal").style.display="block";

}


// MATRIX

const canvas=document.getElementById("matrix");
const ctx=canvas.getContext("2d");


canvas.width=window.innerWidth;
canvas.height=window.innerHeight;


let letters="01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&";

let fontSize=16;

let columns=canvas.width/fontSize;

let drops=[];


for(let i=0;i<columns;i++){
    drops[i]=1;
}


function draw(){

ctx.fillStyle="rgba(0,0,0,0.05)";
ctx.fillRect(0,0,canvas.width,canvas.height);


ctx.fillStyle="#00ff66";
ctx.font=fontSize+"px monospace";


for(let i=0;i<drops.length;i++){

let text=letters[Math.floor(Math.random()*letters.length)];

ctx.fillText(text,i*fontSize,drops[i]*fontSize);


if(drops[i]*fontSize>canvas.height && Math.random()>0.975){

drops[i]=0;

}

drops[i]++;

}

}


setInterval(draw,35);


window.onresize=function(){

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

};

</script>


</body>
</html>

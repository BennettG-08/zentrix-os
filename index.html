<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZENTRIX OS</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    background:#000;
    color:#00ff66;
    font-family:Consolas, monospace;
}

canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:-1;
}


.container{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}


.box{
    width:90%;
    max-width:900px;
    padding:40px;
    background:rgba(0,0,0,.82);
    border:2px solid #00ff66;
    border-radius:15px;
    box-shadow:0 0 40px #00ff66;
    text-align:center;
}


.logo{
    font-size:55px;
    letter-spacing:5px;
    text-shadow:0 0 25px #00ff66;
}


.subtitle{
    margin-top:10px;
    font-size:18px;
}


button{

    margin-top:35px;
    padding:18px 45px;
    font-size:20px;
    font-weight:bold;
    color:#00ff66;
    background:#000;
    border:2px solid #00ff66;
    border-radius:12px;
    cursor:pointer;
    box-shadow:0 0 25px #00ff66;

}


button:hover{

    background:#00ff66;
    color:#000;

}


#terminal{

    display:none;
    margin-top:30px;
    text-align:left;
    line-height:1.8;

}


.title{

    text-align:center;
    font-size:32px;
    text-shadow:0 0 20px #00ff66;

}


.line{

    white-space:nowrap;
    overflow:hidden;
    animation:typing 2s steps(40);

}


@keyframes typing{

from{
    width:0;
}

to{
    width:100%;
}

}


.blink{

    animation:blink 1s infinite;

}


@keyframes blink{

50%{
    opacity:0;
}

}


.creator{

    text-align:center;
    margin-top:25px;
    font-size:14px;
    opacity:.8;

}

</style>

</head>


<body>


<canvas id="matrix"></canvas>


<div class="container">

<div class="box">


<div class="logo">
ZENTRIX OS
</div>


<div class="subtitle">
Sistema futurista v9.0
</div>


<button onclick="startSystem()">
INICIAR ZENTRIX OS
</button>


<div id="terminal">


<div class="title">
ZENTRIX OS v9.0
</div>


<p class="line">
> Inicializando sistema...
</p>


<p class="line">
> Cargando módulos...
</p>


<p class="line">
> Modo leyenda activado...
</p>


<br>


<h2>
LEGENDARIOS DE AMÉRICA
</h2>


<br>


<p>
⭐ Leyendas originales ⭐
</p>


<p>
Siempre humillados por Zentrix
</p>
